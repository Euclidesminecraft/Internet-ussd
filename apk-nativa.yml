name: APK nativa MegaFlow
on:
  push:
    paths: ['nativa/**', '.github/workflows/apk-nativa.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        working-directory: nativa
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MegaFlow-nativa-APK
          path: nativa/app/build/outputs/apk/debug/*.apk
